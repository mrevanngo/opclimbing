[project]
name = "optimalclimbing-backend"
version = "0.1.0"
description = "OptimalClimbing backend: FastAPI API + feedback generation layer"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary,pool]>=3.2",
    "pydantic[email]>=2.8",
    "httpx>=0.27",           # local-LLM (Ollama) feedback provider
    "anthropic>=0.60",       # optional 'anthropic' feedback provider only
    "python-dotenv>=1.0",
    "bcrypt>=4.1",
    "pyjwt>=2.9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["core", "feedback", "models", "routers", "scoring"]
